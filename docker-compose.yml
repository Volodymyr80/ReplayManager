version: '3.8'

services:
  replay_manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: replay_manager
    restart: unless-stopped
    ports:
      - "${PORT:-8008}:8005"
    environment:
      - RABBITMQ_HOST=${RABBITMQ_HOST:-127.0.0.1}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-guest}
      - LOG_EVENTS_QUEUE=${LOG_EVENTS_QUEUE:-log-events}
      - DB_PATH=/app/data/replay.db
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, time; exit(0 if os.path.exists('/tmp/worker_heartbeat') and time.time() - os.path.getmtime('/tmp/worker_heartbeat') < 600 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
